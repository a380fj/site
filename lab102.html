<!DOCTYPE html>
<html>
<head>
    <style>
        .balloon {
            position: absolute;
            transition: transform 0.3s ease-out;
        }
        .explode {
            animation: explode 0.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>
<script>
const COLORS = ['red', 'orange', 'yellow', 'green', 'black', 'blue', 'purple'];
const MAX_ALTITUDE = 1500;  
const GROWTH_RATE = 0.05;  

class Balloon {
    constructor(id) {
        this.element = document.createElement('div');
        this.id = id;
        this.initColor = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.baseSize = Math.random() * 30 + 20;
        this.speed = Math.random() * 5 + 1;
        this.burstAltitude = Math.random() * MAX_ALTITUDE * 0.8 + MAX_ALTITUDE * 0.2;
        this.currentY = MAX_ALTITUDE;
        this.isBurst = false;
        
        this.initElement();
        this.startRise();
    }

    initElement() {
        this.element.className = 'balloon';
        this.element.style.backgroundColor = this.initColor;
        this.element.style.left = `${this.id % 100 * 50}px`;
        this.updateSize();
    }

    updateSize() {
        const altitudeFactor = (MAX_ALTITUDE - this.currentY) / MAX_ALTITUDE;
        const currentSize = this.baseSize * (1 + altitudeFactor * GROWTH_RATE);
        this.element.style.width = `${currentSize}px`;
        this.element.style.height = `${currentSize}px`;
        this.element.style.borderRadius = `${currentSize/2}px`;
    }

    startRise() {
        const animate = () => {
            if (this.isBurst) return;
            
            this.currentY -= this.speed;
            this.element.style.top = `${this.currentY}px`;
            this.updateSize();

            if (this.currentY <= this.burstAltitude) {
                this.burst();
            } else {
                requestAnimationFrame(animate);
            }
        };
        requestAnimationFrame(animate);
    }

    burst() {
        this.isBurst = true;
        this.element.classList.add('explode');
        setTimeout(() => {
            this.element.remove();
        }, 500);
    }
}

for (let i = 0; i < 1000; i++) {
    const balloon = new Balloon(i);
    document.body.appendChild(balloon.element);
}
</script>
</body>
</html>
